[versions]

paper-api = "1.16.5-R0.1-SNAPSHOT"
minecraft = "1.19.4"

# React commit on react-minecraft/plugin, built by JitPack.
react = "df00c45"
actions = "2.2.2"
schedula = "2.0.1"

packetevents = "2.13.0"
configurate = "4.2.0"
cloud-paper = "2.0.0"
cloud-core = "2.0.0"
adventure-api = "4.10.0"
fastutil = "8.5.12"
minestom = "2026.10.07-26.2"
