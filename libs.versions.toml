jetbrains-annotations = "24.1.0"

junit = "6.1.3"
junit-platform = "6.1.3"

lombok = "1.18.48"

shadow = "9.6.1"
run-task = "3.0.2"

[libraries]

paper-api = { module = "com.destroystokyo.paper:paper-api", version.ref = "paper-api" }

react-api = { module = "com.github.react-minecraft.plugin:react-api", version.ref = "react" }
react-common = { module = "com.github.react-minecraft.plugin:react-common", version.ref = "react" }
actions = { module = "com.github.g4vrk:FunctionalActions", version.ref = "actions" }
schedula-common = { module = "com.github.g4vrk.Schedula:common", version.ref = "schedula" }

packetevents = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
cloud-paper = { module = "org.incendo:cloud-paper", version.ref = "cloud-paper" }
cloud-core = { module = "org.incendo:cloud-core", version.ref = "cloud-core" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure-api" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
minestom = { module = "net.minestom:minestom", version.ref = "minestom" }
sponge-api = { module = "org.spongepowered:spongeapi", version.ref = "sponge-api" }
packetevents-sponge = { module = "com.github.retrooper:packetevents-sponge", version.ref = "packetevents" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-adventure-platform = { module = "net.kyori:adventure-platform-fabric", version.ref = "fabric-adventure-platform" }
