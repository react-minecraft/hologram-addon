jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
schedula-sponge = { module = "com.github.g4vrk.Schedula:sponge", version.ref = "schedula" }
schedula-fabric = { module = "com.github.g4vrk.Schedula:fabric", version.ref = "schedula" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }

lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

[plugins]

shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
